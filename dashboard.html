<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --bg2: #0d1424;
      --accent: #6366f1;
      --accent2: #818cf8;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #64748b;
      --border: rgba(99,102,241,0.15);
      --card: rgba(13,20,36,0.9);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    header {
      background: rgba(8,12,20,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .brand-name span { color: var(--accent2); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-badge {
      font-size: 0.72rem;
      background: rgba(99,102,241,0.1);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 4px 12px;
      border-radius: 20px;
      font-family: 'Space Mono', monospace;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .logout-btn:hover { background: rgba(239,68,68,0.1); }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
      position: relative;
      z-index: 1;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .page-sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      display: block;
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* TABLE */
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .table-title {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .refresh-btn:hover { background: rgba(99,102,241,0.1); }

    .scan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.3s;
    }

    .scan-card:hover { border-color: rgba(99,102,241,0.3); }

    .risk-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-safe { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .dot-low { background: var(--yellow); box-shadow: 0 0 8px rgba(234,179,8,0.5); }
    .dot-medium { background: var(--orange); box-shadow: 0 0 8px rgba(249,115,22,0.5); }
    .dot-high { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.5); }

    .scan-url {
      flex: 1;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--text);
      word-break: break-all;
    }

    .scan-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .risk-pill {
      font-size: 0.72rem;
      font-family: 'Space Mono', monospace;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
    }

    .pill-safe { background: rgba(34,197,94,0.1); color: var(--green); }
    .pill-low { background: rgba(234,179,8,0.1); color: var(--yellow); }
    .pill-medium { background: rgba(249,115,22,0.1); color: var(--orange); }
    .pill-high { background: rgba(239,68,68,0.1); color: var(--red); }

    .scan-score {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      width: 50px;
      text-align: right;
    }

    .scan-date {
      font-size: 0.75rem;
      color: var(--muted);
      width: 130px;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .loading-state {
      text-align: center;
      padding: 60px;
      color: var(--accent2);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .scan-date { display: none; }
      header { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon">🛡️</div>
    <span class="brand-name">Phish<span>Guard</span></span>
  </div>
  <div class="header-right">
    <span class="admin-badge">ADMIN</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div class="page-title">Scan History</div>
  <div class="page-sub">All URLs analyzed by PhishGuard</div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-num" id="totalCount" style="color:var(--accent2)">—</span>
      <div class="stat-lbl">Total Scans</div>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="highCount" style="color:var(--red)">—</span>
      <div class="stat-lbl">High Risk</div>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="safeCount" style="color:var(--green)">—</span>
      <div class="stat-lbl">Safe</div>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="todayCount" style="color:var(--yellow)">—</span>
      <div class="stat-lbl">Today</div>
    </div>
  </div>

  <div class="table-header">
    <div class="table-title">// Recent Scans</div>
    <button class="refresh-btn" onclick="loadScans()">↻ Refresh</button>
  </div>

  <div id="scansList">
    <div class="loading-state">Loading scans...</div>
  </div>
</div>

<script>
  const token = localStorage.getItem('adminToken');
  if (!token) window.location.href = 'admin.html';

  async function loadScans() {
    const list = document.getElementById('scansList');
    list.innerHTML = '<div class="loading-state">Loading scans...</div>';

    try {
      const res = await fetch('https://portfolio-backend-0uic.onrender.com/admin/scans', {
        headers: { 'Authorization': token }
      });

      const scans = await res.json();

      if (!Array.isArray(scans) || scans.length === 0) {
        list.innerHTML = '<div class="empty-state">No scans yet. Go analyze some URLs! 🔍</div>';
        ['totalCount','highCount','safeCount','todayCount'].forEach(id => {
          document.getElementById(id).textContent = '0';
        });
        return;
      }

      // Stats
      document.getElementById('totalCount').textContent = scans.length;
      document.getElementById('highCount').textContent = scans.filter(s => s.risk_level === 'HIGH').length;
      document.getElementById('safeCount').textContent = scans.filter(s => s.risk_level === 'SAFE').length;
      const today = new Date().toDateString();
      document.getElementById('todayCount').textContent = scans.filter(s => new Date(s.created_at).toDateString() === today).length;

      list.innerHTML = scans.map(s => {
        const level = (s.risk_level || 'SAFE').toLowerCase();
        const date = new Date(s.created_at).toLocaleString('en-IN');
        return `
          <div class="scan-card">
            <div class="risk-dot dot-${level}"></div>
            <div class="scan-url">${s.url}</div>
            <div class="scan-meta">
              <span class="risk-pill pill-${level}">${s.risk_level}</span>
              <span class="scan-score">${s.risk_score}/100</span>
              <span class="scan-date">${date}</span>
            </div>
          </div>
        `;
      }).join('');

    } catch {
      list.innerHTML = '<div class="empty-state">❌ Failed to load. Try refreshing.</div>';
    }
  }

  function logout() {
    localStorage.removeItem('adminToken');
    window.location.href = 'admin.html';
  }

  loadScans();
</script>

</body>
</html>
