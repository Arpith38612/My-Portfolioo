<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Arpith Thomas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f5ff;
      --neon-pink: #ff006e;
      --neon-green: #39ff14;
      --neon-purple: #bf00ff;
      --bg-void: #020408;
      --bg-deep: #050c14;
      --bg-card: #080f1a;
      --text-main: #e8f4f8;
      --text-dim: #5a8a9f;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-void);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    /* Custom Cursor */
    .cursor { position: fixed; width: 10px; height: 10px; background: var(--neon-cyan); border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: screen; box-shadow: 0 0 10px var(--neon-cyan); }
    .cursor-ring { position: fixed; width: 32px; height: 32px; border: 1px solid rgba(0,245,255,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transition: all 0.15s ease; }

    /* Animated grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridScroll 15s linear infinite;
    }
    @keyframes gridScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--neon-cyan);
      border-radius: 50%;
      animation: float linear infinite;
      box-shadow: 0 0 6px var(--neon-cyan);
    }
    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(var(--drift)); opacity: 0; }
    }

    /* Scan line effect */
    .scanline {
      position: fixed;
      top: -100%;
      left: 0; right: 0;
      height: 200px;
      background: linear-gradient(transparent, rgba(0,245,255,0.03), transparent);
      animation: scan 6s linear infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0% { top: -200px; }
      100% { top: 100vh; }
    }

    /* Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .orb-1 { width: 600px; height: 600px; background: rgba(0,245,255,0.04); top: -150px; right: -150px; animation: pulse 6s ease-in-out infinite; }
    .orb-2 { width: 400px; height: 400px; background: rgba(191,0,255,0.04); bottom: -100px; left: -100px; animation: pulse 8s 2s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    /* Login container */
    .login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      animation: appear 0.8s ease forwards;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-box {
      background: rgba(8, 15, 26, 0.9);
      border: 1px solid rgba(0,245,255,0.2);
      border-radius: 20px;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(0,245,255,0.06), 0 40px 80px rgba(0,0,0,0.6);
    }

    /* Top gradient bar */
    .login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      animation: barShimmer 3s linear infinite;
      background-size: 200%;
    }
    @keyframes barShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* Corner accents */
    .corner {
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--neon-cyan);
      border-style: solid;
      opacity: 0.5;
    }
    .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

    /* Shield icon */
    .shield-wrap {
      text-align: center;
      margin-bottom: 32px;
    }
    .shield-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(0,245,255,0.05);
      border: 1px solid rgba(0,245,255,0.2);
      font-size: 2rem;
      position: relative;
      animation: shieldPulse 3s ease-in-out infinite;
    }
    @keyframes shieldPulse {
      0%,100% { box-shadow: 0 0 20px rgba(0,245,255,0.1); }
      50% { box-shadow: 0 0 40px rgba(0,245,255,0.3), 0 0 80px rgba(0,245,255,0.1); }
    }

    .access-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 5px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .login-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      text-align: center;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--text-main), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .login-sub {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    /* Input groups */
    .field {
      margin-bottom: 24px;
      position: relative;
    }
    .field label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .input-wrap {
      position: relative;
    }
    .field-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.4;
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 14px 18px 14px 46px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(0,245,255,0.15);
      border-radius: 10px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
      letter-spacing: 1px;
    }
    input::placeholder { color: var(--text-dim); opacity: 0.5; }
    input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 3px rgba(0,245,255,0.08), 0 0 20px rgba(0,245,255,0.05);
    }

    /* Login button */
    .login-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 1px solid var(--neon-cyan);
      border-radius: 10px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--neon-cyan);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
    }
    .login-btn:hover { color: var(--bg-void); box-shadow: 0 0 30px rgba(0,245,255,0.3); }
    .login-btn:hover::before { transform: translateX(0); }
    .login-btn span { position: relative; z-index: 1; }

    .login-btn.loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      border: 2px solid var(--neon-cyan);
      border-top-color: transparent;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Error message */
    .error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(255,0,110,0.08);
      border: 1px solid rgba(255,0,110,0.3);
      border-radius: 8px;
      color: var(--neon-pink);
      font-size: 0.75rem;
      text-align: center;
      letter-spacing: 1px;
      display: none;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,245,255,0.08);
    }
    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .status-dot::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green);
      animation: statusBlink 2s ease-in-out infinite;
    }
    @keyframes statusBlink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .version-tag { font-size: 0.6rem; color: rgba(0,245,255,0.3); letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="bg-grid"></div>
  <div class="scanline"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="particles" id="particles"></div>

  <div class="login-wrap">
    <div class="login-box">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="shield-wrap">
        <div class="shield-icon">🛡️</div>
      </div>

      <div class="access-tag">Restricted Access</div>
      <h1 class="login-title">Admin Panel</h1>
      <p class="login-sub">Arpith Thomas · Portfolio</p>

      <div class="field">
        <label>Username</label>
        <div class="input-wrap">
          <span class="field-icon">👤</span>
          <input type="text" id="username" placeholder="Enter username" autocomplete="off" />
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <span class="field-icon">🔑</span>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
      </div>

      <button class="login-btn" id="loginBtn" onclick="login()">
        <span id="btnText">Authenticate</span>
      </button>

      <div class="error-msg" id="errorMsg">⚠️ Invalid credentials — access denied</div>

      <div class="status-bar">
        <div class="status-dot">Secure Connection</div>
        <div class="version-tag">v2.0.1</div>
      </div>
    </div>
  </div>

  <script>
    // ── Custom Cursor ──
    const cur = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      cur.style.left=mx-5+'px'; cur.style.top=my-5+'px';
    });
    (function anim(){
      rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
      ring.style.left=rx-16+'px'; ring.style.top=ry-16+'px';
      requestAnimationFrame(anim);
    })();

    // ── Floating Particles ──
    const pContainer = document.getElementById('particles');
    for(let i=0;i<30;i++){
      const p = document.createElement('div');
      p.className='particle';
      p.style.cssText=`
        left:${Math.random()*100}%;
        --drift:${(Math.random()-0.5)*100}px;
        animation-duration:${6+Math.random()*12}s;
        animation-delay:${Math.random()*10}s;
        opacity:${0.2+Math.random()*0.6};
        width:${1+Math.random()*3}px;
        height:${1+Math.random()*3}px;
      `;
      pContainer.appendChild(p);
    }

    // ── Login Logic ──
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      errorMsg.style.display = 'none';
      btn.classList.add('loading');
      btnText.style.opacity = '0';

      try {
        const response = await fetch('https://portfolio-backend-0uic.onrender.com/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          btnText.textContent = '✓ Access Granted';
          btnText.style.opacity = '1';
          btn.style.background = 'var(--neon-green)';
          btn.style.borderColor = 'var(--neon-green)';
          btn.style.color = 'var(--bg-void)';
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        } else {
          btn.classList.remove('loading');
          btnText.style.opacity = '1';
          errorMsg.style.display = 'block';
          errorMsg.style.animation = 'none';
          void errorMsg.offsetWidth;
          errorMsg.style.animation = 'shake 0.4s ease';
        }
      } catch (error) {
        btn.classList.remove('loading');
        btnText.style.opacity = '1';
        errorMsg.textContent = '⚡ Cannot connect to server. Try again.';
        errorMsg.style.display = 'block';
      }
    }

    document.addEventListener('keypress', e => { if(e.key==='Enter') login(); });
  </script>
</body>
</html>
